<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تصفح العقارات | العقار الذكي</title>
    
    <!-- CDN Dependencies -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.1/nouislider.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/rtl-overrides.css">
    
    <style>
        /* nouislider overrides for our theme */
        .noUi-connect { background: var(--primary-color); }
        .noUi-horizontal { height: 10px; border-radius: 5px; }
        .noUi-handle {
            width: 20px !important;
            height: 20px !important;
            border-radius: 50%;
            top: -6px !important;
            right: -10px !important;
            box-shadow: var(--shadow-sm);
        }
        .noUi-handle::before, .noUi-handle::after { display: none; }
        
        .property-card { height: 100%; display: flex; flex-direction: column; }
        .property-img-wrapper { position: relative; padding-top: 66%; overflow: hidden; border-radius: calc(var(--card-radius) - 1px) calc(var(--card-radius) - 1px) 0 0; }
        .property-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
        .property-card:hover .property-img { transform: scale(1.05); }
        .property-badge { position: absolute; top: 10px; right: 10px; z-index: 2; }
    </style>
</head>
<body class="bg-light">

    <!-- Sticky Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <i class="bi bi-building me-2 text-primary"></i>
                العقار الذكي
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">الرئيسية</a></li>
                    <li class="nav-item"><a class="nav-link active" href="property-listing.html">تصفح العقارات</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <a href="login.html" class="btn btn-outline-primary px-4">تسجيل الدخول</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row">
            <!-- Sidebar Filter -->
            <div class="col-lg-3 mb-4">
                <div class="card p-4 sticky-top" style="top: 85px; z-index: 1;">
                    <h5 class="fw-bold mb-4 border-bottom pb-3"><i class="bi bi-funnel me-2"></i> تصفية البحث</h5>
                    
                    <form id="filterForm">
                        <div class="mb-4">
                            <label class="form-label fw-bold">نوع العقار</label>
                            <select class="form-select" id="filterType">
                                <option value="all">الكل</option>
                                <option value="apartment">شقة</option>
                                <option value="villa">فيلا</option>
                                <option value="office">مكتب</option>
                                <option value="shop">محل تجاري</option>
                            </select>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold">المدينة</label>
                            <select class="form-select" id="filterCity">
                                <option value="all">كل المدن</option>
                                <option value="cairo">القاهرة</option>
                                <option value="giza">الجيزة</option>
                                <option value="alex">الإسكندرية</option>
                            </select>
                        </div>
                        
                        <div class="mb-4 pt-2">
                            <label class="form-label fw-bold d-block mb-3">نطاق السعر (شهرياً)</label>
                            <div id="priceSlider" class="mb-3" dir="rtl"></div>
                            <div class="d-flex justify-content-between text-secondary small">
                                <span id="priceMin">0 ج.م</span>
                                <span id="priceMax">50,000+ ج.م</span>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold">عدد الغرف</label>
                            <div class="btn-group w-100" role="group">
                                <input type="radio" class="btn-check filter-rooms" name="rooms" id="roomsAll" value="all" autocomplete="off" checked>
                                <label class="btn btn-outline-primary" for="roomsAll">الكل</label>

                                <input type="radio" class="btn-check filter-rooms" name="rooms" id="rooms1" value="1" autocomplete="off">
                                <label class="btn btn-outline-primary" for="rooms1">1</label>

                                <input type="radio" class="btn-check filter-rooms" name="rooms" id="rooms2" value="2" autocomplete="off">
                                <label class="btn btn-outline-primary" for="rooms2">2</label>

                                <input type="radio" class="btn-check filter-rooms" name="rooms" id="rooms3+" value="3" autocomplete="off">
                                <label class="btn btn-outline-primary" for="rooms3+">+3</label>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="filterFurnished">
                                <label class="form-check-label fw-bold" for="filterFurnished">مفروش فقط</label>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100">تطبيق التصفية</button>
                    </form>
                </div>
            </div>

            <!-- Property Grid -->
            <div class="col-lg-9">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="fw-bold mb-0">العقارات المتاحة (<span id="resultsCount">0</span>)</h4>
                    <div class="d-flex align-items-center">
                        <label class="me-2 text-nowrap">ترتيب حسب:</label>
                        <select class="form-select w-auto" id="sortSelect">
                            <option value="newest">الأحدث</option>
                            <option value="price_asc">السعر (الأقل للأعلى)</option>
                            <option value="price_desc">السعر (الأعلى للأقل)</option>
                            <option value="area_desc">المساحة (الأكبر)</option>
                        </select>
                    </div>
                </div>

                <div class="row g-4" id="propertiesGrid">
                    <!-- Cards will be injected here via AJAX -->
                </div>
                
                <div class="text-center mt-5 d-none" id="noResults">
                    <i class="bi bi-search text-secondary" style="font-size: 3rem;"></i>
                    <h5 class="mt-3 text-secondary">عفواً، لا توجد عقارات مطابقة لبحثك</h5>
                    <button class="btn btn-outline-primary mt-2" onclick="location.reload()">إعادة ضبط البحث</button>
                </div>

                <!-- Pagination Placeholder -->
                <nav class="mt-5 d-none" id="paginationNav">
                    <ul class="pagination justify-content-center">
                        <li class="page-item disabled"><a class="page-link" href="#">السابق</a></li>
                        <li class="page-item active"><a class="page-link" href="#">1</a></li>
                        <li class="page-item"><a class="page-link" href="#">2</a></li>
                        <li class="page-item"><a class="page-link" href="#">التالي</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.1/nouislider.min.js"></script>
    
    <script type="module" src="../assets/js/utils.js"></script>
    <script type="module" src="../assets/js/properties.js"></script>
</body>
</html>
