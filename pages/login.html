<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | العقار الذكي</title>
    
    <!-- CDN Dependencies -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/rtl-overrides.css">
</head>
<body class="d-flex align-items-center py-4 bg-light" style="min-height: 100vh;">

    <main class="form-signin w-100 m-auto" style="max-width: 450px;">
        <div class="card p-4 p-md-5 border-0 shadow-md">
            <div class="text-center mb-4">
                <a href="index.html" class="text-decoration-none">
                    <h2 class="fw-bold text-primary mb-0"><i class="bi bi-building me-2"></i>العقار الذكي</h2>
                </a>
                <p class="text-secondary mt-2">مرحباً بك مجدداً، يرجى تسجيل الدخول</p>
            </div>

            <form id="loginForm" novalidate>
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                    <label for="email">البريد الإلكتروني</label>
                    <div class="invalid-feedback">يرجى إدخال بريد إلكتروني صحيح.</div>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="password" placeholder="Password" required>
                    <label for="password">كلمة المرور</label>
                    <div class="invalid-feedback">يرجى إدخال كلمة المرور.</div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="remember-me" id="rememberMe">
                        <label class="form-check-label text-secondary" for="rememberMe">
                            تذكرني
                        </label>
                    </div>
                    <a href="#" class="text-decoration-none text-primary">نسيت كلمة المرور؟</a>
                </div>
                
                <div id="loginError" class="alert alert-danger d-none" role="alert"></div>

                <button class="w-100 btn btn-lg btn-primary mb-3" type="submit" id="loginBtn">
                    <span class="spinner-border spinner-border-sm d-none me-2" role="status" aria-hidden="true" id="loginSpinner"></span>
                    تسجيل الدخول
                </button>
                
                <div class="text-center mt-3">
                    <span class="text-secondary">ليس لديك حساب؟ </span>
                    <a href="register-tenant.html" class="text-decoration-none fw-bold text-primary">سجل الآن</a>
                </div>
            </form>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Compiled JS -->
    <script type="module" src="../assets/js/utils.js"></script>
    <script type="module" src="../assets/js/auth.js"></script>
</body>
</html>
